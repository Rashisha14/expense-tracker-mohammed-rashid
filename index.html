<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Expense Tracker</h1>
            <p>Track your income and expenses easily</p>
        </header>

        <!--Summary -->
        <section class="summary">

            <div class="summary-card income">
                <span>Total Income</span>
                <h2 id="totalIncome">₹0.00</h2>
            </div>

            <div class="summary-card expense">
                <span>Total Expenses</span>
                <h2 id="totalExpense">₹0.00</h2>
            </div>

            <div class="summary-card balance">
                <span>Balance</span>
                <h2 id="balance">₹0.00</h2>
            </div>

        </section>

        <!-- Transaction Form -->
        <section class="card">

            <h2 id="formTitle">Add Transaction</h2>

            <form id="transactionForm" novalidate>

                <div class="form-group">

                    <label for="type">Type</label>

                    <select id="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="amount">Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">Category</label>

                    <select id="category" required>

                        <option value="">Select category</option>

                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">Date</label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">Description</label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Example: Lunch"
                        maxlength="100"
                        required
                    >

                </div>


                <button type="submit" id="submitButton">
                    Add Transaction
                </button>

                <button
                    type="button"
                    id="cancelButton"
                    class="cancel-btn hidden"
                >
                    Cancel
                </button>

                <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>

            </form>

        </section>


        <!-- Filters -->
        <section class="card">

            <div class="filter-header">

                <h2>Transactions</h2>

                <div class="filters">

                    <select id="filterType">

                        <option value="all">All Types</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>

                    </select>


                    <select id="filterCategory">

                        <option value="all">All Categories</option>

                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>

                    </select>

                </div>

            </div>


            <div id="transactionList" class="transaction-list">

                <!-- Transactions appear here -->

            </div>

        </section>


        <!-- Monthly Summary -->
        <section class="card">

            <h2>Monthly Expense Summary</h2>

            <div id="monthlySummary"></div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
